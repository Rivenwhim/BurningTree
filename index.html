<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background-color: #2c2c2c;
      color: #d3d3d3;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .tree ul {
      list-style-type: none;
      margin-left: 20px;
      padding-left: 0;
    }
    .tree li {
      cursor: pointer;
    }
  </style>
  <title>Burning Tree</title>
</head>
<body>
  <h1 style="color: #00ff00; text-align: center;">Burning Tree</h1>
  <div class="tree">
    <ul>
      <li>Hellfire Citadel
        <ul>
          <li>Hellfire Ramparts</li>
            <ul>
              <li>Bonechewer Destroyer</li>
              <li>Bleeding Hollow Scryer</li>
              <li>Bonechewer Beastmaster</li>
            </ul>
          <li>Blood Furnace</li>
        </ul>
      </li>
    </ul>
  </div>
  <script>
    const items = document.querySelectorAll('.tree li');
    items.forEach(item => {
      const children = item.querySelector('ul');
      if (children) {
        children.style.display = 'none';
        item.prepend(document.createTextNode('+ '));
        item.addEventListener('click', e => {
          e.stopPropagation();
          if (children.style.display === 'none') {
            children.style.display = 'block';
            item.firstChild.textContent = '- ';
          }
          else {
            children.style.display = 'none';
            item.firstChild.textContent = '+ ';
          }
        });
      }
    });
  </script>
</body>
</html>
